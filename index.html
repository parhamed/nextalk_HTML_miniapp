<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<title>پنل مدیریت کلاس‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #0e1530;
    --surface: rgba(255, 255, 255, 0.04);
    --surface-2: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #e8ecf6;
    --muted: #8b95ad;
    --primary: #6d7cff;
    --primary-2: #9b6dff;
    --accent: #22d3ee;
    --success: #34d399;
    --danger: #fb7185;
    --warning: #fbbf24;
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
    --trans: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: "Vazirmatn", system-ui, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(700px circle at 90% -10%, rgba(109, 124, 255, 0.20), transparent 45%),
      radial-gradient(600px circle at 0% 5%, rgba(34, 211, 238, 0.12), transparent 42%),
      radial-gradient(700px circle at 50% 115%, rgba(155, 109, 255, 0.16), transparent 48%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
    padding: calc(12px + var(--safe-t)) 12px calc(28px + var(--safe-b));
  }

  ::selection { background: var(--primary); color: #fff; }

  /* ===== Topbar ===== */
  .topbar {
    position: sticky;
    top: calc(8px + var(--safe-t));
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 760px;
    margin: 0 auto 16px;
    padding: 13px 16px;
    background: rgba(14, 21, 48, 0.72);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-logo {
    width: 44px; height: 44px; border-radius: 13px; flex: none;
    display: grid; place-items: center; font-size: 21px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 8px 22px rgba(109, 124, 255, 0.45);
  }
  .brand-title { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; flex: none; }
  .live-dot {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--muted);
    padding: 7px 12px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--surface-2); white-space: nowrap;
  }
  .live-dot i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); box-shadow: 0 0 0 0 var(--success);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
    70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }

  /* ===== Layout ===== */
  .layout { display: flex; flex-direction: column; gap: 16px; max-width: 760px; margin: 0 auto; }
  .content { display: flex; flex-direction: column; gap: 16px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
  }
  .panel-head .icon {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    display: grid; place-items: center; font-size: 18px;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .panel-head h2 { font-size: 15.5px; font-weight: 700; }
  .panel-head p { font-size: 11.5px; color: var(--muted); }
  .panel-body { padding: 16px; }

  /* ===== Collapsible / Accordion ===== */
  .panel.collapsible .panel-head { cursor: pointer; user-select: none; }
  .panel-head .chev {
    margin-inline-start: auto; flex: none;
    font-size: 22px; line-height: 1; color: var(--muted);
    transition: transform 0.3s ease;
  }
  .panel.collapsed .chev { transform: rotate(180deg); }
  .panel.collapsed { padding-bottom: 8px; }
  .panel.collapsed .panel-head { border-bottom-color: transparent; }

  .panel-collapse {
    display: grid; grid-template-rows: 1fr;
    transition: grid-template-rows 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .panel.collapsed .panel-collapse { grid-template-rows: 0fr; }
  .panel-collapse > .panel-body { overflow: hidden; min-height: 0; }

  /* ===== Form ===== */
  .field { margin-bottom: 14px; }
  .field > label {
    display: block; font-size: 13px; font-weight: 600;
    margin-bottom: 7px; color: var(--text);
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 12px 14px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-family: inherit; font-size: 14px; outline: none;
    transition: border-color var(--trans), box-shadow var(--trans);
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(109, 124, 255, 0.2);
  }
  .field select { appearance: none; cursor: pointer; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px; border: none; border-radius: var(--radius-sm);
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: transform var(--trans), filter var(--trans);
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 8px 22px rgba(109, 124, 255, 0.4);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-block { width: 100%; }
  .btn-ghost {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border);
  }

  /* ===== Data Cards ===== */
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px;
    transition: border-color var(--trans), transform var(--trans);
  }
  .card:hover { border-color: var(--border-strong); }
  .card.selected { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-title { font-size: 14.5px; font-weight: 700; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600;
    padding: 5px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  }
  .badge.lvl { color: var(--accent); border-color: rgba(34,211,238,0.3); }
  .badge.day { color: var(--primary); border-color: rgba(109,124,255,0.3); }
  .badge.ok { color: var(--success); border-color: rgba(52,211,153,0.3); }
  .card-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 34px; height: 34px; flex: none; border-radius: 10px;
    display: grid; place-items: center; cursor: pointer; font-size: 15px;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    transition: var(--trans);
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

  /* ===== States ===== */
  .state { text-align: center; padding: 28px 16px; color: var(--muted); }
  .state .em { font-size: 34px; display: block; margin-bottom: 10px; opacity: 0.7; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--primary);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Toast ===== */
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + var(--safe-b));
    transform: translateX(-50%) translateY(140%);
    z-index: 100; max-width: 90vw;
    padding: 13px 18px; border-radius: var(--radius-sm);
    background: rgba(14, 21, 48, 0.95); border: 1px solid var(--border-strong);
    backdrop-filter: blur(16px); box-shadow: var(--shadow);
    font-size: 13.5px; font-weight: 600;
    transition: transform 0.4s cubic-bezier(0.2,0.8,0.2,1); opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.ok { border-color: rgba(52,211,153,0.5); }
  .toast.err { border-color: rgba(251,113,133,0.5); }

  @media (max-width: 420px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">🎓</div>
      <div>
        <div class="brand-title">پنل مدیریت کلاس‌ها</div>
        <div class="brand-sub">مدیریت کلاس‌ها و کاربران</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="live-dot"><i></i> آنلاین</span>
    </div>
  </header>

  <div class="layout">
    <div class="content">

      <!-- Create class -->
      <section class="panel">
        <div class="panel-head">
          <div class="icon">➕</div>
          <div>
            <h2>ایجاد کلاس جدید</h2>
            <p>اطلاعات کلاس را وارد کنید</p>
          </div>
        </div>
        <div class="panel-body">
          <form id="classForm">
            <div class="field">
              <label for="className">عنوان کلاس</label>
              <input type="text" id="className" placeholder="مثلاً: مکالمه پیشرفته" required />
            </div>
            <div class="grid-2">
              <div class="field">
                <label for="classLevel">سطح</label>
                <select id="classLevel" required>
                  <option value="">انتخاب کنید</option>
                  <option value="beginner">مبتدی</option>
                  <option value="intermediate">متوسط</option>
                  <option value="advanced">پیشرفته</option>
                </select>
              </div>
              <div class="field">
                <label for="classDay">روز برگزاری</label>
                <select id="classDay" required>
                  <option value="">انتخاب کنید</option>
                  <option value="sat">شنبه</option>
                  <option value="sun">یکشنبه</option>
                  <option value="mon">دوشنبه</option>
                  <option value="tue">سه‌شنبه</option>
                  <option value="wed">چهارشنبه</option>
                  <option value="thu">پنجشنبه</option>
                  <option value="fri">جمعه</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">ثبت کلاس</button>
          </form>
        </div>
      </section>

      <!-- Classes list (collapsible) -->
      <section class="panel collapsible collapsed" id="classesPanel">
        <div class="panel-head" onclick="togglePanel('classesPanel')">
          <div class="icon">📚</div>
          <div>
            <h2>لیست کلاس‌ها</h2>
            <p id="classesSub">برای مشاهده ضربه بزنید</p>
          </div>
          <span class="chev">⌄</span>
        </div>
        <div class="panel-collapse">
          <div class="panel-body">
            <div id="classesList" class="cards">
              <div class="state"><div class="spinner"></div>در حال بارگذاری…</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Users list (collapsible) -->
      <section class="panel collapsible collapsed" id="usersPanel">
        <div class="panel-head" onclick="togglePanel('usersPanel')">
          <div class="icon">👥</div>
          <div>
            <h2>کاربران کلاس</h2>
            <p id="usersSub">ابتدا یک کلاس را انتخاب کنید</p>
          </div>
          <span class="chev">⌄</span>
        </div>
        <div class="panel-collapse">
          <div class="panel-body">
            <div id="usersList" class="cards">
              <div class="state"><span class="em">🫥</span>کلاسی انتخاب نشده است</div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ===== Config (unchanged) =====
  const API_URL = "https://nextalk-n8n.ir/webhook/miniapp-classes";

  const levelMap = {
    beginner: "مبتدی",
    intermediate: "متوسط",
    advanced: "پیشرفته"
  };
  const dayMap = {
    sat: "شنبه", sun: "یکشنبه", mon: "دوشنبه",
    tue: "سه‌شنبه", wed: "چهارشنبه", thu: "پنجشنبه", fri: "جمعه"
  };

  let selectedClassId = null;

  // ===== Accordion =====
  function togglePanel(id) {
    document.getElementById(id).classList.toggle("collapsed");
  }
  function expandPanel(id) {
    document.getElementById(id).classList.remove("collapsed");
  }

  // ===== Toast =====
  function toast(msg, type = "ok") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show " + type;
    clearTimeout(t._tm);
    t._tm = setTimeout(() => t.classList.remove("show"), 2800);
  }

  // ===== Load classes =====
  async function loadClasses() {
    const box = document.getElementById("classesList");
    box.innerHTML = '<div class="state"><div class="spinner"></div>در حال بارگذاری…</div>';
    try {
      const res = await fetch(API_URL, { method: "GET" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const classes = Array.isArray(data) ? data : (data.classes || []);
      renderClasses(classes);
    } catch (e) {
      box.innerHTML = '<div class="state"><span class="em">⚠️</span>خطا در دریافت اطلاعات</div>';
      toast("اتصال به سرور ناموفق بود", "err");
    }
  }

  function renderClasses(classes) {
    const box = document.getElementById("classesList");
    const sub = document.getElementById("classesSub");
    if (!classes.length) {
      box.innerHTML = '<div class="state"><span class="em">📭</span>هنوز کلاسی ثبت نشده است</div>';
      sub.textContent = "بدون کلاس";
      return;
    }
    sub.textContent = classes.length + " کلاس";
    box.innerHTML = classes.map(c => {
      const id = c.id ?? c._id ?? "";
      const name = c.name ?? c.title ?? "بدون عنوان";
      const lvl = levelMap[c.level] || c.level || "—";
      const day = dayMap[c.day] || c.day || "—";
      const count = c.usersCount ?? c.students ?? 0;
      return `
        <div class="card" data-id="${id}" onclick="selectClass('${id}', this)">
          <div class="card-top">
            <div class="card-title">${name}</div>
            <div class="card-actions">
              <div class="icon-btn danger" onclick="deleteClass(event,'${id}')">🗑</div>
            </div>
          </div>
          <div class="card-meta">
            <span class="badge lvl">📊 ${lvl}</span>
            <span class="badge day">📅 ${day}</span>
            <span class="badge ok">👤 ${count} نفر</span>
          </div>
        </div>`;
    }).join("");
  }

  // ===== Select class -> load users =====
  function selectClass(id, el) {
    selectedClassId = id;
    document.querySelectorAll("#classesList .card").forEach(c => c.classList.remove("selected"));
    if (el) el.classList.add("selected");
    getUsers(id);
  }

  async function getUsers(classId) {
    const box = document.getElementById("usersList");
    const sub = document.getElementById("usersSub");

    // باز کردن خودکار پنل کاربران هنگام انتخاب کلاس
    expandPanel("usersPanel");

    box.innerHTML = '<div class="state"><div class="spinner"></div>در حال بارگذاری کاربران…</div>';
    sub.textContent = "در حال بارگذاری…";
    try {
      const res = await fetch(API_URL + "?classId=" + encodeURIComponent(classId), { method: "GET" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const users = Array.isArray(data) ? data : (data.users || []);
      renderUsers(users);
    } catch (e) {
      box.innerHTML = '<div class="state"><span class="em">⚠️</span>خطا در دریافت کاربران</div>';
      sub.textContent = "خطا";
      toast("دریافت کاربران ناموفق بود", "err");
    }
  }

  function renderUsers(users) {
    const box = document.getElementById("usersList");
    const sub = document.getElementById("usersSub");
    if (!users.length) {
      box.innerHTML = '<div class="state"><span class="em">🙋</span>کاربری در این کلاس نیست</div>';
      sub.textContent = "بدون کاربر";
      return;
    }
    sub.textContent = users.length + " کاربر";
    box.innerHTML = users.map(u => {
      const name = u.name ?? u.fullName ?? "کاربر";
      const phone = u.phone ?? u.mobile ?? "—";
      return `
        <div class="card">
          <div class="card-top">
            <div class="card-title">${name}</div>
          </div>
          <div class="card-meta">
            <span class="badge">📞 ${phone}</span>
          </div>
        </div>`;
    }).join("");
  }

  // ===== Create class =====
  document.getElementById("classForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const payload = {
      name: document.getElementById("className").value.trim(),
      level: document.getElementById("classLevel").value,
      day: document.getElementById("classDay").value
    };
    if (!payload.name || !payload.level || !payload.day) {
      toast("لطفاً همه فیلدها را پر کنید", "err");
      return;
    }
    btn.disabled = true;
    btn.textContent = "در حال ثبت…";
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      toast("کلاس با موفقیت ثبت شد", "ok");
      e.target.reset();
      expandPanel("classesPanel");
      loadClasses();
    } catch (err) {
      toast("ثبت کلاس ناموفق بود", "err");
    } finally {
      btn.disabled = false;
      btn.textContent = "ثبت کلاس";
    }
  });

  // ===== Delete class =====
  async function deleteClass(ev, id) {
    ev.stopPropagation();
    if (!confirm("این کلاس حذف شود؟")) return;
    try {
      const res = await fetch(API_URL + "?classId=" + encodeURIComponent(id), { method: "DELETE" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      toast("کلاس حذف شد", "ok");
      loadClasses();
    } catch (e) {
      toast("حذف ناموفق بود", "err");
    }
  }

  // ===== Init =====
  loadClasses();
</script>
</body>
</html>
